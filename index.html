<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Ukuran Logo Standar (Desktop/Laptop) */
    .logo {
      width: 120px; /* Diubah dari 12px menjadi 120px */
      height: auto;
      margin-bottom: 12px;
    }

    /* Ukuran Logo Khusus Layar HP */
    @media (max-width: 480px) {
      .logo {
        width: 140px; /* Diperbesar agar jelas di HP */
      }
    }

    .header h1 {
      font-size: 22px;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13px;
      color: #64748b;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #94a3b8;
    }
    .alert {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }
    .alert-success {
      background-color: #dcfce7;
      color: #15803d;
    }
    .alert-error {
      background-color: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <!-- Tag Gambar Logo -->
      <img src="logo.jpg" alt="Logo SMK As-Syafi'iyah" class="logo">
      <h1>Buku Tamu Digital</h1>
      <p>Silakan isi formulir kehadiran di bawah ini</p>
    </div>

    <form id="guestForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" required>
      </div>

      <div class="form-group">
        <label for="instansi">Instansi / Perusahaan</label>
        <input type="text" id="instansi" required>
      </div>

      <div class="form-group">
        <label for="tujuan">Bertemu Dengan</label>
        <input type="text" id="tujuan" required>
      </div>

      <div class="form-group">
        <label for="keperluan">Keperluan</label>
        <textarea id="keperluan" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label for="telepon">No Telepon / WhatsApp</label>
        <input type="tel" id="telepon" placeholder="Contoh: 081234567890" required>
      </div>

      <button type="submit" id="btnSubmit">Simpan Kehadiran</button>
    </form>

    <div id="alertSuccess" class="alert alert-success">
      Data berhasil dikirim! Terima kasih.
    </div>

    <div id="alertError" class="alert alert-error">
      Gagal mengirim data. Silakan coba lagi.
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA1sZWAva7YUSxvUzaUWPEt5LH7R4IlRIePdPuJ624NSdw90Z7xlKjbNZ_74zkyGbI/exec";

    document.getElementById('guestForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const btnSubmit = document.getElementById('btnSubmit');
      const alertSuccess = document.getElementById('alertSuccess');
      const alertError = document.getElementById('alertError');

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Mengirim...";

      const payload = {
        nama: document.getElementById('nama').value,
        instansi: document.getElementById('instansi').value,
        tujuan: document.getElementById('tujuan').value,
        keperluan: document.getElementById('keperluan').value,
        telepon: document.getElementById('telepon').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alertSuccess.style.display = 'block';
        alertError.style.display = 'none';
        this.reset();
      })
      .catch(error => {
        console.error('Error!', error.message);
        alertError.style.display = 'block';
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Simpan Kehadiran";

        setTimeout(() => {
          alertSuccess.style.display = 'none';
          alertError.style.display = 'none';
        }, 4000);
      });
    });
  </script>

</body>
</html>
