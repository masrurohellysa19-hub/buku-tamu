<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Buku Tamu Digital</h1>
      <p class="text-sm text-slate-500">Silakan isi formulir kehadiran di bawah ini</p>
    </div>

    <form id="guestForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
        <input type="text" id="nama" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Instansi / Perusahaan</label>
        <input type="text" id="instansi" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Orang yang Dituju</label>
        <input type="text" id="tujuan" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Keperluan</label>
        <textarea id="keperluan" rows="3" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition flex items-center justify-center">
        <span>Simpan Kehadiran</span>
      </button>
    </form>

    <div id="alertSuccess" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-lg text-center font-medium">
      Data berhasil dikirim ke resepsionis! Terima kasih.
    </div>
    
    <div id="alertError" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-center font-medium">
      Gagal mengirim data. Silakan coba lagi.
    </div>
  </div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT
    const SCRIPT_URL = "PASTE_URL_WEB_APP_DI_SINI";

    document.getElementById('guestForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Mengirim...";

      const payload = {
        nama: document.getElementById('nama').value,
        instansi: document.getElementById('instansi').value,
        tujuan: document.getElementById('tujuan').value,
        keperluan: document.getElementById('keperluan').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Untuk menghindari masalah CORS pada Google Script
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById('alertSuccess').classList.remove('hidden');
        document.getElementById('alertError').classList.add('hidden');
        this.reset();
      })
      .catch(error => {
        console.error('Error!', error.message);
        document.getElementById('alertError').classList.remove('hidden');
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Simpan Kehadiran";

        setTimeout(() => {
          document.getElementById('alertSuccess').classList.add('hidden');
          document.getElementById('alertError').classList.add('hidden');
        }, 4000);
      });
    });
  </script>
</body>
</html>
