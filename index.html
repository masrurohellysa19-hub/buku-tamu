
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buku Tamu Digital</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">
        Buku Tamu Digital
      </h1>

      <p class="text-sm text-slate-500 mt-1">
        Silakan isi formulir kehadiran di bawah ini
      </p>
    </div>

    <!-- Form -->
    <form id="guestForm" class="space-y-4">

      <!-- Nama -->
      <div>
        <label
          for="nama"
          class="block text-sm font-medium text-slate-700 mb-1">
          Nama Lengkap
        </label>

        <input
          type="text"
          id="nama"
          name="nama"
          required
          autocomplete="name"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
      </div>

      <!-- Instansi -->
      <div>
        <label
          for="instansi"
          class="block text-sm font-medium text-slate-700 mb-1">
          Instansi / Perusahaan
        </label>

        <input
          type="text"
          id="instansi"
          name="instansi"
          required
          autocomplete="organization"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
      </div>

      <!-- Orang yang dituju -->
      <div>
        <label
          for="tujuan"
          class="block text-sm font-medium text-slate-700 mb-1">
          Orang yang Dituju
        </label>

        <input
          type="text"
          id="tujuan"
          name="tujuan"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
      </div>

      <!-- Keperluan -->
      <div>
        <label
          for="keperluan"
          class="block text-sm font-medium text-slate-700 mb-1">
          Keperluan
        </label>

        <textarea
          id="keperluan"
          name="keperluan"
          rows="3"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"></textarea>
      </div>

      <!-- No Telepon -->
      <div>
        <label
          for="telepon"
          class="block text-sm font-medium text-slate-700 mb-1">
          No. Telepon
        </label>

        <input
          type="int"
          id="telepon"
          name="telepon"
          required
          autocomplete="tel"
          placeholder="Contoh: 081234567890"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
      </div>

      <!-- Tombol -->
      <button
        type="submit"
        id="btnSubmit"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center">

        <span id="btnText">
          Simpan Kehadiran
        </span>
      </button>

    </form>

    <!-- Alert sukses -->
    <div
      id="alertSuccess"
      class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-lg text-center font-medium">

      Data berhasil dikirim ke resepsionis! Terima kasih.

    </div>

    <!-- Alert error -->
    <div
      id="alertError"
      class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-center font-medium">

      Gagal mengirim data. Silakan coba lagi.

    </div>

  </div>


  <script>

    /*
      =========================================================
      URL GOOGLE APPS SCRIPT
      =========================================================

      Pastikan URL berikut adalah URL Web App Google Apps Script
      yang berakhiran /exec
    */

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzOk2Cr0ogUUBY6NFeV918svjEwoEXgs0Q_mVx1uHpEfpuh_o64yjnEqlyEs0XTSn9B/exec";


    /*
      =========================================================
      FORM SUBMIT
      =========================================================
    */

    document
      .getElementById("guestForm")
      .addEventListener("submit", function (e) {

        e.preventDefault();

        const form = this;

        const btnSubmit =
          document.getElementById("btnSubmit");

        const btnText =
          document.getElementById("btnText");

        const alertSuccess =
          document.getElementById("alertSuccess");

        const alertError =
          document.getElementById("alertError");


        /*
          Sembunyikan notifikasi sebelumnya
        */

        alertSuccess.classList.add("hidden");
        alertError.classList.add("hidden");


        /*
          Nonaktifkan tombol
        */

        btnSubmit.disabled = true;
        btnText.innerText = "Mengirim...";


        /*
          Ambil data formulir
        */

        const payload = {

          nama:
            document.getElementById("nama").value.trim(),

          instansi:
            document.getElementById("instansi").value.trim(),

          tujuan:
            document.getElementById("tujuan").value.trim(),

          keperluan:
            document.getElementById("keperluan").value.trim(),

          telepon:
            document.getElementById("telepon").value.trim()

        };


        /*
          Kirim data ke Google Apps Script
        */

        fetch(SCRIPT_URL, {

          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },

          body: JSON.stringify(payload)

        })

        .then(() => {

          /*
            Tampilkan pesan berhasil
          */

          alertSuccess.classList.remove("hidden");

          alertError.classList.add("hidden");

          /*
            Kosongkan formulir
          */

          form.reset();

        })

        .catch((error) => {

          console.error(
            "Terjadi kesalahan:",
            error
          );

          alertError.classList.remove("hidden");

          alertSuccess.classList.add("hidden");

        })

        .finally(() => {

          /*
            Aktifkan kembali tombol
          */

          btnSubmit.disabled = false;

          btnText.innerText =
            "Simpan Kehadiran";


          /*
            Hilangkan notifikasi
            setelah 4 detik
          */

          setTimeout(() => {

            alertSuccess.classList.add("hidden");

            alertError.classList.add("hidden");

          }, 4000);

        });

      });

  </script>

</body>
</html>
